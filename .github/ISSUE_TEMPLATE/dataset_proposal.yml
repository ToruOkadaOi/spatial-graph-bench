name: New Dataset Proposal
description: Propose a new spatial transcriptomics dataset for benchmark inclusion
labels: ["dataset", "enhancement"]
body:
  - type: markdown
    attributes:
      value: Proposals for new spatial transcriptomics datasets must meet our pre-registered quality gates (§1 of STUDY_PROTOCOL.md).
  - type: input
    id: dataset_name
    attributes:
      label: Dataset Name & Platform
      description: Platform (e.g. Visium HD, CosMx, Slide-seqV2, Stereo-seq) and tissue organism.
      placeholder: visium_hd_mouse_brain
    validations:
      required: true
  - type: input
    id: paper_url
    attributes:
      label: Publication & Data Source URL
      description: Link to publication, GEO accession, or Zenodo/Dryad repository.
    validations:
      required: true
  - type: dropdown
    id: hierarchy
    attributes:
      label: Split Hierarchy Type
      description: What natural biological hierarchy governs this dataset?
      options:
        - "donor_held_out (Multiple biological donors/animals)"
        - "section_held_out (Serial 3D tissue sections from same specimen)"
        - "replicate_held_out (Technical replicates without donor IDs)"
    validations:
      required: true
  - type: textarea
    id: cell_counts
    attributes:
      label: Number of Cells, Genes & Cell Classes
      description: Approximate number of spots/cells, targeted/whole-transcriptome genes, and annotated classes.
    validations:
      required: true
