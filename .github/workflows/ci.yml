name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras

      - name: Run Ruff Linter & Formatter Check (Mandatory)
        run: |
          uv run --frozen ruff check src tests scripts
          uv run --frozen ruff format --check src tests scripts

      - name: Run Mypy (Informational / Non-blocking)
        continue-on-error: true
        run: |
          uv run --frozen mypy --python-version ${{ matrix.python-version }} --explicit-package-bases src tests scripts

      - name: Run Pytest Suite & Fixture Smoke Pipeline (Mandatory)
        run: |
          uv run --frozen pytest -v tests
